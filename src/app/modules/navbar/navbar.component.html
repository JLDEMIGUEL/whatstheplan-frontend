<header>
  <nav class="navbar">
    <div class="brand">
      <a routerLink="/" class="brand-logo">WhatsThePlan</a>
    </div>
    <div class="nav-links">
      <ul *ngIf="!(isLoggedIn$ | async)">
        <li>
          <a routerLink="/login" class="nav-link">Login</a>
        </li>
        <li>
          <a routerLink="/register" class="nav-link">Sign Up</a>
        </li>
      </ul>

      <div
        class="user-dropdown"
        *ngIf="isLoggedIn$ | async"
        (click)="toggleDropdown()"
      >
        <button class="nav-link dropdown-button">
          Profile <span class="arrow" [class.open]="dropdownOpen">&#9662;</span>
        </button>

        <!-- Floating / Dropdown Menu -->
        <div class="dropdown-menu" [class.show]="dropdownOpen">
          <a routerLink="/profile" class="dropdown-item">Profile</a>
          <a routerLink="/my-events" class="dropdown-item">My Events</a>
          <a routerLink="/my-registrations" class="dropdown-item">My Registrations</a>
          <button class="dropdown-item logout-button" (click)="onLogout($event)">Logout</button>
        </div>
      </div>
    </div>
  </nav>
</header>
