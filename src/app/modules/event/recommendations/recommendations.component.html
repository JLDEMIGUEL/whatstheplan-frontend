<div *ngIf="recommendations.length > 0; else noRecommendations">
  <div class="events-container">
    <!-- Filters Bar -->
    <form class="filters-bar" (ngSubmit)="applyFilters()">
      <!-- Duration Range Dropdown -->
      <div class="dropdown-range">
        <div class="dropdown-header" (click)="toggleDurationDropdown()">
          Duration range
        </div>
        <div class="dropdown-content" *ngIf="durationDropdownOpen">
          <input
            type="number"
            min="0"
            max="24"
            placeholder="Hours From"
            [(ngModel)]="filters.durationFrom"
            name="durationFrom"
          />
          <input
            type="number"
            min="0"
            max="24"
            placeholder="Hours To"
            [(ngModel)]="filters.durationTo"
            name="durationTo"
          />
          <button type="button" (click)="closeDurationDropdown()">OK</button>
        </div>
      </div>

      <!-- Datetime Range Dropdown -->
      <div class="dropdown-range">
        <div class="dropdown-header" (click)="toggleDateTimeDropdown()">
          Datetime range
        </div>
        <div class="dropdown-content" *ngIf="dateTimeDropdownOpen">
          <input
            type="datetime-local"
            placeholder="From"
            [(ngModel)]="filters.dateTimeFrom"
            name="dateTimeFrom"
          />
          <input
            type="datetime-local"
            placeholder="To"
            [(ngModel)]="filters.dateTimeTo"
            name="dateTimeTo"
          />
          <button type="button" (click)="closeDateTimeDropdown()">OK</button>
        </div>
      </div>

      <!-- Activity Types (Multiple selection) -->
      <div class="dropdown-range activity-dropdown">
        <div class="dropdown-header" (click)="toggleActivityDropdown()">
          Activity Types
        </div>
        <div class="dropdown-content" *ngIf="activityDropdownOpen">
          <div *ngFor="let category of activityTypes">
            <div class="category-label">{{ category.category }}</div>
            <div *ngFor="let activity of category.names">
              <label>
                <input
                  type="checkbox"
                  [checked]="filters.activityTypes.includes(activity)"
                  (change)="onActivityChange(activity, $event)"
                />
                {{ activity }}
              </label>
            </div>
          </div>
          <button type="button" (click)="closeActivityDropdown()">OK</button>
        </div>
      </div>

      <button type="submit">Apply Filters</button>
    </form>

    <!-- Create New Event Button -->
    <div class="create-event-container">
      <button (click)="createNewEvent()">
        <span class="plus-circle">+</span>
        <span class="btn-text">Create new event</span>
      </button>
    </div>

    <!-- Events Cards -->
    <div *ngFor="let event of recommendations" class="event-card">
      <img
        [src]="getImageUrl(event.imageKey)"
        alt="{{ event.title }}"
        class="event-image"
      />
      <div class="event-content">
        <h3>{{ event.title }}</h3>
        <p>{{ event.description }}</p>
        <button (click)="viewEventDetails(event)">See Details</button>
      </div>
    </div>
  </div>
</div>

<ng-template #noRecommendations>
  <p>No personalized recommendations available.</p>
</ng-template>

<div *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</div>
